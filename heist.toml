# Gliese Heist: everything the game says and steals. Edit freely, then restart the app.
# The app checks this file on start and says exactly what's wrong if something is off.
#
# Placeholders you can use in lines:
#   {crew}    the crew name (Gumis)        {one}     one crew member (Gumi)
#   {count}   how many joined              {target}  the heist target
#   {item}    the loot (steal race)        {name}    the winner's name (steal race)
# Use {{ and }} for a literal { or }. When only one joined, {crew} reads as {one}.
#
# Keep crew, one, ranks, targets and loot ABOVE the [lines] header: in TOML, anything
# written under a [section] header belongs to that section.

crew = "Gumis"      # what the whole chat is called
one = "Gumi"        # one of them

# Stash ranks by how many items someone has stolen in total. Lowest first, starting at 0.
ranks = [
  { at = 0, name = "Gumi Recruit" },
  { at = 3, name = "Pickpocket" },
  { at = 10, name = "Cat Burglar" },
  { at = 25, name = "Master Thief" },
  { at = 50, name = "Lumi's Favorite Gumi" },
]

# Heist targets. difficulty: 1 easy, 2 normal, 3 hard. Harder = lower odds, better loot.
targets = [
  { name = "the last slice of pizza at a sleepover", difficulty = 1 },
  { name = "every left sock in a laundromat", difficulty = 1 },
  { name = "a museum gift shop's entire keychain wall", difficulty = 1 },
  { name = "the jar of spare buttons in Grandma's sewing room", difficulty = 1 },
  { name = "a city's whole supply of traffic cones", difficulty = 1 },
  { name = "the shiny pennies from a wishing fountain", difficulty = 1 },
  { name = "the claw machine's prize that nobody can win", difficulty = 2 },
  { name = "the Moon's reflection from a puddle", difficulty = 2 },
  { name = "a dragon's hoard (the dragon is a very large cat)", difficulty = 2 },
  { name = "the secret recipe from a famous noodle shop", difficulty = 2 },
  { name = "the golden trophy from a hot-dog-eating contest", difficulty = 2 },
  { name = "the crown jewels of a country that doesn't exist", difficulty = 2 },
  { name = "the world's largest ball of yarn", difficulty = 2 },
  { name = "a sunset, wrapped to go", difficulty = 3 },
  { name = "the smile off a very famous painting", difficulty = 3 },
  { name = "the Earth's spare gravity", difficulty = 3 },
  { name = "the Wi-Fi password from a five-star hotel", difficulty = 3 },
  { name = "a meteorite from the most guarded museum on Earth", difficulty = 3 },
]

# Loot. rarity: common, rare or legendary.
loot = [
  { name = "a slightly used traffic cone", rarity = "common" },
  { name = "one (1) left sock", rarity = "common" },
  { name = "a rubber duck with sunglasses", rarity = "common" },
  { name = "a keychain that says 'I <3 Earth'", rarity = "common" },
  { name = "a handful of bubble wrap", rarity = "common" },
  { name = "a lost TV remote", rarity = "common" },
  { name = "a spork", rarity = "common" },
  { name = "the 'wet floor' sign", rarity = "common" },
  { name = "a mysterious key to nothing", rarity = "common" },
  { name = "a free sample toothpick", rarity = "common" },
  { name = "a garden gnome", rarity = "common" },
  { name = "a pigeon's favorite breadcrumb", rarity = "common" },
  { name = "a scratched lottery ticket (lost)", rarity = "common" },
  { name = "an extremely shiny pebble", rarity = "common" },
  { name = "a golden spatula", rarity = "rare" },
  { name = "a snow globe with a real snowstorm inside", rarity = "rare" },
  { name = "a jar of bottled thunder", rarity = "rare" },
  { name = "the claw machine's plushie", rarity = "rare" },
  { name = "a pocket watch that runs backwards", rarity = "rare" },
  { name = "a map to a treasure that's already stolen", rarity = "rare" },
  { name = "a crown made of bottle caps", rarity = "rare" },
  { name = "a cat's entire nap spot, still warm", rarity = "rare" },
  { name = "a sliver of the Moon's reflection", rarity = "legendary" },
  { name = "a sunset, slightly folded", rarity = "legendary" },
  { name = "a stardust shard from Gliese 667C", rarity = "legendary" },
  { name = "the world's last spare gravity", rarity = "legendary" },
