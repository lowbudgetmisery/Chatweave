# Builds chatweave.exe on a real Windows machine for every push, using build_exe.ps1 under
# Windows PowerShell 5.1 (what most streamers have). Pushing a tag like v1.8.2 also publishes
# the zip on the repo's Releases page, so people can download it without installing Python.
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed only to publish a release for tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"

      - name: Build (runs the self-tests first)
        shell: powershell
        env:
          CHATWEAVE_PYTHON: ${{ steps.py.outputs.python-path }}  # build with exactly this Python, not the newest installed
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File ".\build_exe.ps1"
          if ($LASTEXITCODE -ne 0) { throw "build_exe.ps1 failed with code $LASTEXITCODE" }

      - name: Smoke test the built app
        shell: powershell
        run: |
          $exe = (Resolve-Path ".\dist\chatweave\chatweave.exe").Path
          # cmd merges the app's log lines (stderr) into the output. Done in PowerShell 5.1 with
          # 2>&1, those lines become errors and stop the step before anything is checked.
          $out = (cmd /c "`"$exe`" check 2>&1" | Out-String)
          Write-Host $out
          # No YouTube login on the build machine, so "check" exits 1; it must still load the bundled YouTube code.
          if ($out -notmatch "YouTube proto: built in") { throw "packaged app could not load its YouTube code" }
          $global:LASTEXITCODE = 0  # the expected "login missing" exit code must not fail this step

      - uses: actions/upload-artifact@v6
        with:
          name: chatweave-windows
          path: dist/chatweave_app_v*.zip
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem ".\dist" -Filter "chatweave_app_v*.zip" | Select-Object -First 1
          if (-not $zip) { throw "no zip to publish" }
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($zip.Name -ne "chatweave_app_v$tagVersion.zip") { throw "tag ${{ github.ref_name }} does not match the app version in $($zip.Name)" }
          $notes = "Windows app, no Python needed. Download $($zip.Name), right-click it, Properties, tick Unblock, OK, then extract it. Start with Start Chat.bat. See README.md for setup and CHANGELOG.md for what's new."
          gh release create "${{ github.ref_name }}" "$($zip.FullName)" --title "Chatweave ${{ github.ref_name }}" --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with code $LASTEXITCODE" }
